name: ScreenWings PE extraction and REA/Ghidra

on:
  workflow_dispatch:
    inputs:
      sample_url:
        description: "HTTPS EXE or ZIP; blank means historical vendor URL (SHA256 checked)"
        required: false
        type: string
      expected_sha256:
        description: "Expected exact sample SHA256"
        required: true
        default: "481ecd41bef2a33076729680747eb92e4e2964bed89c58825d80f602de19f214"
        type: string
      publish_extracted:
        description: "Commit complete raw extracted resources/sections (only if redistribution is authorized)"
        required: true
        type: boolean
        default: false
  push:
    paths:
      - "samples/ScreenWings.exe"

permissions:
  contents: write

concurrency:
  group: screenwings-research
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SAMPLE: samples/ScreenWings.exe
      REA_GHIDRA_STARTUP_TIMEOUT_MS: "900000"
      EXPECTED_SHA256: ${{ inputs.expected_sha256 || '481ecd41bef2a33076729680747eb92e4e2964bed89c58825d80f602de19f214' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Resolve specimen and verify exact identity
        shell: bash
        env:
          INPUT_URL: ${{ inputs.sample_url }}
        run: |
          set -euo pipefail
          mkdir -p samples analysis/rea analysis/extracted
          # Vendor download may be a ZIP; the resolver searches for the exact
          # uploaded specimen digest, never trusting only the published version.
          if [[ -f "$SAMPLE" ]]; then
            python tools/resolve_sample.py --sample "$SAMPLE" 2>&1 | tee analysis/rea/sample_source.log
          elif [[ -n "$INPUT_URL" ]]; then
            python tools/resolve_sample.py --sample "$SAMPLE" --url "$INPUT_URL" 2>&1 | tee analysis/rea/sample_source.log
          else
            echo "::error::No checked-in specimen. The default historical vendor URL may have changed. Publish the verified EXE to samples/ScreenWings.exe (only when authorized), or supply sample_url in a manual dispatch." | tee analysis/rea/sample_source.log
            exit 2
          fi
          echo "${EXPECTED_SHA256}  ${SAMPLE}" | sha256sum --check --status || {
            echo "::error::Input specimen SHA256 mismatch; refusing to analyze."
            sha256sum "$SAMPLE"
            exit 1
          }
          stat -c '%n %s bytes' "$SAMPLE" | tee analysis/rea/source_size.txt
          sha256sum "$SAMPLE" | tee analysis/rea/source_sha256.txt
      - name: Lossless raw PE sections, resources, overlay and evidence inventory
        shell: bash
        run: |
          set -euo pipefail
          python tools/pe_unpack.py "$SAMPLE" --out analysis/extracted
          python -m json.tool analysis/extracted/manifest.json >/dev/null
      - name: Restore the complete schiffer section with static aPLib decompression
        shell: bash
        run: |
          set -euo pipefail
          python tools/unpack_stage1.py "$SAMPLE" --out analysis/stage1
          python -m json.tool analysis/stage1/report.json >/dev/null
      - name: Recover 43 stage-two E9/PUSHF thunk entries (no target execution)
        shell: bash
        run: |
          set -euo pipefail
          python tools/extract_stage2_jump_thunks.py analysis/stage1/schiffer_stage1.bin --out analysis/stage2_thunks
          python tools/scan_stage2_thunk_consumers.py analysis/stage1/schiffer_stage1.bin --out analysis/stage2-consumers
          python tools/extract_stage2_reloc1267.py analysis/stage1/schiffer_stage1.bin --out analysis/stage2_reloc1267
          python tools/verify_stage2_dispatch.py analysis/stage1/schiffer_stage1.bin --out analysis/stage2_reloc1267/dispatch_verified.json
          python tools/verify_stage2_ret_dispatch.py analysis/stage1/schiffer_stage1.bin --out analysis/stage2_reloc1267/ret_dispatch_verified.json
          # Re-check previously captured bounded-model writes; this does NOT recreate native VM traces.
          python tools/diagnose_p0_edi_provenance.py analysis/stage1/schiffer_stage1.bin analysis/p0_model_memory_writes.csv --out analysis/stage2_reloc1267/p0_edi_provenance_verified.json
          python tools/audit_p0_pointer_seh.py analysis/stage1/schiffer_stage1.bin analysis/p0_model_memory_writes.csv --out analysis/stage2_reloc1267/p0_seh_candidate_audit.json
          python tools/verify_p0_seh_registration.py analysis/stage1/schiffer_stage1.bin --out analysis/stage2_reloc1267/p0_seh_registration_verified.json
          python -m json.tool analysis/stage2_thunks/stage2_jump_thunks.json >/dev/null
      - name: Install REA 6.4.0 and Ghidra 12.1.4
        shell: bash
        run: |
          set -euo pipefail
          npm install --global rea-agents@6.4.0
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/ghidra.zip" \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP"
          GHIDRA_HOME="$RUNNER_TEMP/ghidra_12.1.4_PUBLIC"
          test -f "$GHIDRA_HOME/support/analyzeHeadless"
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_HOME" >> "$GITHUB_ENV"
          rea --version
      - name: REA/Ghidra static analysis of the restored stage-one image
        shell: bash
        run: |
          set -uo pipefail
          # Log command failures instead of hiding the entire REA step status.
          restored="analysis/stage1/ScreenWings_stage1_for_Ghidra_DO_NOT_RUN.exe"
          failed=0
          rea doctor --provider ghidra --json > analysis/rea/doctor.json 2>analysis/rea/doctor.stderr.txt
          rc=$?; echo "$rc" > analysis/rea/doctor.exitcode; (( rc == 0 )) || failed=1
          rea analyze "$restored" --provider ghidra --json > analysis/rea/restored_overview.json 2>analysis/rea/restored_overview.stderr.txt
          rc=$?; echo "$rc" > analysis/rea/restored_overview.exitcode; (( rc == 0 )) || failed=1
          rea decompile "$restored" 0x70909A --provider ghidra --json > analysis/rea/restored_entry.json 2>analysis/rea/restored_entry.stderr.txt
          rc=$?; echo "$rc" > analysis/rea/restored_entry.exitcode; (( rc == 0 )) || failed=1
          # String search can be negative because protection encrypts imports.
          for query in SetWindowDisplayAffinity GetProcAddress CreateWindowExW BitBlt WinLicense Oreans; do
            rea search "$restored" "$query" --provider ghidra --json > "analysis/rea/search_${query}.json" 2> "analysis/rea/search_${query}.stderr.txt"
            echo $? > "analysis/rea/search_${query}.exitcode"
          done
          if (( failed )); then
            echo "::error::One or more REA/Ghidra primary commands failed; inspect uploaded logs"
            exit 1
          fi
      - name: Build offline archive
        if: always()
        shell: bash
        run: |
          mkdir -p analysis
          if [[ -f analysis/extracted/manifest.json ]]; then
            (cd analysis && zip -qr "$RUNNER_TEMP/screenwings-pe-raw.zip" extracted rea stage1 stage2_thunks stage2-consumers stage2_reloc1267)
            cp "$RUNNER_TEMP/screenwings-pe-raw.zip" analysis/screenwings-pe-raw.zip
          fi
      - name: Upload research archive and REA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenwings-research
          path: analysis/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit raw extracted artifacts to this repository
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.publish_extracted && hashFiles('analysis/stage1/report.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(find analysis/extracted analysis/rea analysis/stage1 analysis/stage2_thunks analysis/stage2-consumers analysis/stage2_reloc1267 -type f -size +95M -print -quit)" ]]; then
            echo "::warning::Large files not committed; download artifact instead."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f analysis/extracted analysis/rea analysis/stage1 analysis/stage2_thunks analysis/stage2-consumers analysis/stage2_reloc1267 analysis/stage2_reloc1267
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "research: extract ScreenWings PE and collect REA evidence"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
